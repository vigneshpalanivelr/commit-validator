[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=mrproper
    --cov=manage_container
    --cov=webhook-server
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=90
    -v
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (external deps)
    slow: Slow-running tests
