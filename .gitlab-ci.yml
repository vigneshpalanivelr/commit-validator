# GitLab CI/CD Pipeline for MR Validator
# Runs automated tests on every commit and merge request

stages:
  - test
  - report

# Default Docker image for CI jobs
image: python:3.9-slim

# Cache pip packages to speed up builds
cache:
  paths:
    - .cache/pip
    - venv/

# Global variables
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTEST_ADDOPTS: "--color=yes"

# Install dependencies (shared across jobs)
.install_deps: &install_deps
  before_script:
    - apt-get update && apt-get install -y git docker.io
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements-test.txt
    - pip install -e .

# ===========================================================================
# Test Jobs
# ===========================================================================

# Unit tests - fast, isolated tests
test:unit:
  stage: test
  <<: *install_deps
  script:
    - source venv/bin/activate
    - pytest tests/unit -m unit -v --tb=short
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - htmlcov/
      - .coverage
    reports:
      junit: test-results.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Integration tests - tests with mocked external services
test:integration:
  stage: test
  <<: *install_deps
  script:
    - source venv/bin/activate
    - pytest tests/integration -m integration -v --tb=short
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - htmlcov/
      - .coverage
    reports:
      junit: test-results.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: false

# Full test suite with coverage
test:coverage:
  stage: test
  <<: *install_deps
  script:
    - source venv/bin/activate
    - pytest --cov --cov-report=html --cov-report=term --cov-report=xml --junitxml=test-results.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - htmlcov/
      - coverage.xml
      - .coverage
      - test-results.xml
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Quick smoke tests - subset of critical tests
test:smoke:
  stage: test
  <<: *install_deps
  script:
    - source venv/bin/activate
    - pytest tests/unit/test_manage_container.py::test_format_bytes -v
    - pytest tests/unit/test_manage_container.py::test_mask_value -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - when: manual
  allow_failure: true

# ===========================================================================
# Code Quality Jobs
# ===========================================================================

# Lint checking
lint:
  stage: test
  image: python:3.9-slim
  before_script:
    - pip install flake8 pylint
  script:
    - flake8 mrproper/ manage_container.py --max-line-length=120 --extend-ignore=E203,W503 || true
    - pylint mrproper/ manage_container.py --max-line-length=120 --disable=C0111,R0903 || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true

# Security scanning
security:
  stage: test
  image: python:3.9-slim
  before_script:
    - pip install bandit safety
  script:
    - bandit -r mrproper/ manage_container.py -f json -o bandit-report.json || true
    - safety check --json || true
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true

# ===========================================================================
# Report Jobs
# ===========================================================================

# Generate coverage badge
coverage:badge:
  stage: report
  image: python:3.9-slim
  before_script:
    - pip install coverage-badge
  script:
    - coverage-badge -o coverage.svg -f
  artifacts:
    paths:
      - coverage.svg
    expire_in: 30 days
  dependencies:
    - test:coverage
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true

# ===========================================================================
# Multi-version testing (optional - only on main branch)
# ===========================================================================

# Test on Python 3.8
test:py38:
  stage: test
  image: python:3.8-slim
  <<: *install_deps
  script:
    - source venv/bin/activate
    - pytest --cov --cov-report=term -v
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: true

# Test on Python 3.10
test:py310:
  stage: test
  image: python:3.10-slim
  <<: *install_deps
  script:
    - source venv/bin/activate
    - pytest --cov --cov-report=term -v
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: true

# Test on Python 3.11
test:py311:
  stage: test
  image: python:3.11-slim
  <<: *install_deps
  script:
    - source venv/bin/activate
    - pytest --cov --cov-report=term -v
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: true
